# cargo-deny: licenças, advisories e origem das dependências.
# Rodar com `just deny` (ou `cargo deny check`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Só avisos de "sem manutenção", transitivos e sem versão alternativa. Rever a cada
# atualização de Leptos/Tauri e remover quando sumirem do Cargo.lock.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: macro de build usada pelo Leptos 0.8" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: via gtk-rs 0.18, usado pelo Tauri no Linux" },
  # zbus 5 (D-Bus no Linux) via tauri-plugin-opener e single-instance; as macros foram para o zbus 6, que o Tauri ainda não usa.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: sem manutenção avulsa, via zbus 5 dos plugins do Tauri" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: sem manutenção avulsa, via zbus 5 dos plugins do Tauri" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: sem manutenção avulsa, via zbus 5 dos plugins do Tauri" },
  # Sem correção publicada em nenhuma versão do rsa. O CodatOS só assina localmente com chaves
  # RSA importadas na autenticação SSH; não decifra RSA nem expõe um oráculo de padding.
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin): sem versão corrigida; via ssh-key, só assinatura local de chaves RSA importadas" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# A lista vale para o M0 inteiro; nem toda licença aparece desde o primeiro PR.
unused-allowed-license = "allow"
# Compatíveis com MIT (licença do projeto). Acrescentar só com justificativa no PR.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
