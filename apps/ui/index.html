<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodatOS</title>
    <!-- Recursos WASM que o Rust ≥ 1.87 liga por padrão; o wasm-opt precisa saber deles. -->
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <!-- Tailwind 4 (CLI standalone baixado pelo Trunk, versão em Trunk.toml). -->
    <link data-trunk rel="tailwind-css" href="styles/app.css" />
    <!-- Fontes embutidas no bundle: nada de CDN (docs/07-design-system.md). -->
    <link data-trunk rel="copy-dir" href="assets/fonts" />
    <!-- xterm.js (terminal), carregado só quando a primeira aba de terminal abre. -->
    <link data-trunk rel="copy-dir" href="assets/xterm" />
  </head>
  <body></body>
</html>
