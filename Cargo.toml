[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "apps/ui",
  "crates/collectors",
  "crates/connections",
  "crates/core",
  "crates/protocol",
  "crates/sensors",
  "crates/store",
  "crates/vault",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/andrecodato/CodatOS"
authors = ["André Codato"]
publish = false

# Versões fixadas em um lugar só. Cada PR do M0 acrescenta aqui o que passa a usar
# (Axum no núcleo, Leptos na UI, Tauri no desktop) e os crates herdam com
# `dep = { workspace = true }`.
[workspace.dependencies]
codatos-collectors = { path = "crates/collectors" }
codatos-connections = { path = "crates/connections" }
codatos-core = { path = "crates/core" }
codatos-protocol = { path = "crates/protocol" }
codatos-sensors = { path = "crates/sensors" }
codatos-store = { path = "crates/store" }
codatos-vault = { path = "crates/vault" }
# Cofre (RustCrypto): versões estáveis amplamente usadas, sem os recursos de RNG próprios
# (os nonces e sais vêm do getrandom).
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
console_error_panic_hook = "0.1.7"
futures-channel = "0.3.34"
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.12.4"
# Keychain do SO (modo sessão do cofre, Q-36), só os stores usados em cada SO.
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
js-sys = "0.3.106"
# Bibliotecas dos drivers carregadas em tempo de execução (ADL da AMD).
libloading = "0.8.9"
leptos = { version = "0.8.22", features = ["csr"] }
nvml-wrapper = "0.13.0"
# TLS do SO (SChannel no Windows, Security no macOS, OpenSSL no Linux): sem C extra no build do Windows.
# PTY multiplataforma (ConPTY no Windows) para os terminais locais.
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = { version = "3.0.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# Sem SQLCipher por enquanto: no M2 só os segredos são cifrados, pelo cofre (Q-37).
# Formato das chaves SSH; a mesma versão que o russh fixa, para trocar chaves sem conversão.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "p384", "rsa", "encryption", "ppk", "getrandom"] }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network", "component"] }
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-build = "2.7.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
# Mesma versão que o Trunk baixa para o wasm-bindgen-cli (precisam bater).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
winreg = "0.56.0"
# Serviço do Windows que lê os sensores da CPU pelo PawnIO (Q-13).
windows-service = "0.8.1"
windows-sys = "0.61.2"
zeroize = { version = "1.9.1", features = ["derive"] }
web-sys = { version = "0.3.106", features = [
    "BinaryType",
    "Clipboard",
    "CloseEvent",
    "Crypto",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "Headers",
    "History",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "ResizeObserver",
    "Response",
    "UrlSearchParams",
    "VisibilityState",
    "WebSocket",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Bundle WASM da UI pequeno (RNF-DES-05: < 2 MB gzip).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
