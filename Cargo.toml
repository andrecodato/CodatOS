[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "apps/ui",
  "crates/collectors",
  "crates/core",
  "crates/protocol",
  "crates/sensors",
  "crates/store",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/andrecodato/CodatOS"
authors = ["André Codato"]
publish = false

# Versões fixadas em um lugar só. Cada PR do M0 acrescenta aqui o que passa a usar
# (Axum no núcleo, Leptos na UI, Tauri no desktop) e os crates herdam com
# `dep = { workspace = true }`.
[workspace.dependencies]
codatos-collectors = { path = "crates/collectors" }
codatos-core = { path = "crates/core" }
codatos-protocol = { path = "crates/protocol" }
codatos-sensors = { path = "crates/sensors" }
codatos-store = { path = "crates/store" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
console_error_panic_hook = "0.1.7"
futures-channel = "0.3.34"
futures-util = "0.3.34"
getrandom = "0.4.3"
js-sys = "0.3.106"
# Bibliotecas dos drivers carregadas em tempo de execução (ADL da AMD).
libloading = "0.8.9"
leptos = { version = "0.8.22", features = ["csr"] }
nvml-wrapper = "0.13.0"
# TLS do SO (SChannel no Windows, Security no macOS, OpenSSL no Linux): sem C extra no build do Windows.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# Sem SQLCipher no M1: a cifra entra com o cofre (M3).
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network", "component"] }
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-build = "2.7.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
# Mesma versão que o Trunk baixa para o wasm-bindgen-cli (precisam bater).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
winreg = "0.56.0"
# Serviço do Windows que lê os sensores da CPU pelo PawnIO (Q-13).
windows-service = "0.8.1"
windows-sys = "0.61.2"
web-sys = { version = "0.3.106", features = [
    "CloseEvent",
    "Crypto",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "Headers",
    "History",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Navigator",
    "PointerEvent",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "UrlSearchParams",
    "VisibilityState",
    "WebSocket",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Bundle WASM da UI pequeno (RNF-DES-05: < 2 MB gzip).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
