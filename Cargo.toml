[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "apps/ui",
  "crates/core",
  "crates/protocol",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/andrecodato/CodatOS"
authors = ["André Codato"]
publish = false

# Versões fixadas em um lugar só. Cada PR do M0 acrescenta aqui o que passa a usar
# (Axum no núcleo, Leptos na UI, Tauri no desktop) e os crates herdam com
# `dep = { workspace = true }`.
[workspace.dependencies]
codatos-core = { path = "crates/core" }
codatos-protocol = { path = "crates/protocol" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
console_error_panic_hook = "0.1.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = "2.12.4"
tauri-build = "2.7.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
# Mesma versão que o Trunk baixa para o wasm-bindgen-cli (precisam bater).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "CloseEvent",
    "Headers",
    "History",
    "Location",
    "MessageEvent",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "UrlSearchParams",
    "WebSocket",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Bundle WASM da UI pequeno (RNF-DES-05: < 2 MB gzip).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
