name: release-please

# A cada push na main, o release-please mantém um PR de release (versão + CHANGELOG
# a partir dos Conventional Commits). Ao mergear esse PR, ele cria a tag `app-vX.Y.Z`
# e o GitHub Release, e este workflow chama o build dos instaladores.
#
# Tag e release criados com o GITHUB_TOKEN não disparam outros workflows
# (`on: push: tags` / `on: release`), por isso o build é chamado aqui via
# `workflow_call` em vez de reagir à tag.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: PR de release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Instaladores
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
