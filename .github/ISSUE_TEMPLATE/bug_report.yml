name: 🐛 Bug
description: Algo não funciona como deveria
labels: ["bug", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! **Nunca** cole senhas, chaves, tokens, IPs privados ou dados financeiros aqui.
        Falhas de **segurança** não devem virar issue pública — veja o `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra …
        2. Clique em …
        3. Veja o erro …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Onde acontece?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Navegador
        - Celular (PWA)
        - Nuvem / sincronização
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do CodatOS
      placeholder: "0.1.0"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico
      description: Cole o resultado de Configurações → Sobre → Copiar diagnóstico (já vem sem dados sensíveis).
      render: text
